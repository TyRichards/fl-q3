<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FL Q3</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { overflow-y: scroll; scroll-snap-type: y mandatory; }
  section { height: 100vh; display: flex; align-items: center; justify-content: center; scroll-snap-align: start; }
  .frame { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>
<section><div class="frame"><img src="01-slide-change.png" alt=""></div></section>
<section><div class="frame"><img src="02-slide-nick.png" alt=""></div></section>
<section><div class="frame"><img src="03-slide-16-agents.png" alt=""></div></section>
<section><div class="frame"><img src="04-slide-terminals.png" alt=""></div></section>
<section><div class="frame"><img src="05-slide-team.png" alt=""></div></section>
<section><div class="frame"><img src="06-slide-obey.png" alt=""></div></section>
<section><div class="frame"><img src="07-slide-don.png" alt=""></div></section>
<section><div class="frame"><img src="08-slide-portal.png" alt=""></div></section>
<section><div class="frame"><img src="09-slide-end.png" alt=""></div></section>
<script>
  const slides = [...document.querySelectorAll('section')];
  const current = () => Math.round(window.scrollY / window.innerHeight);
  const go = i => slides[Math.max(0, Math.min(slides.length - 1, i))].scrollIntoView({ behavior: 'smooth' });
  document.addEventListener('keydown', e => {
    if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(current() + 1); }
    else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(current() - 1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(slides.length - 1); }
  });
</script>
</body>
</html>
